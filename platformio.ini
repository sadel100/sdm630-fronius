; SDM72D-M → Fronius Symo: SunSpec-Zähler-Emulation auf einem ESP32-WROOM-32
;
; Übersetzen:   pio run
; Flashen:      pio run -t upload
; Debug-Monitor: pio device monitor   (115200 Baud)

[platformio]
default_envs = esp32

[env:esp32]
; Gleiche Plattform wie im Puffer-Projekt (Arduino-Core 3.0.2), ist schon installiert.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/2024.07.00/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    miq19/eModbus@1.7.4
    knolleary/PubSubClient@2.8
build_flags =
    ; Meldungen von eModbus selbst: 0 = aus, 3 = Fehler, 4 = Info, 5 = alles
    -DLOG_LEVEL=3
